name: Deploy Astro site to GitHub Pages

on:
  # Build on pushes to main that touch Astro project
  push:
    branches: [main]
    paths:
      - 'astro/**'
      - '.github/workflows/pages-astro.yml'
  # Build after live-data workflow completes (data updated → rebuild)
  workflow_run:
    workflows:
      - "Sync live multi-source catalog data"
      - "AI Shovel Evaluation"
    types: ["completed"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent multiple concurrent deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ===== 把根目录 evaluations/ 复制到 astro/public/evaluations/ =====
      # 这样 Astro build 会自动 public → dist，upload-pages-artifact 也必然包含
      - name: Sync evaluations/ into public/
        run: |
          cd ..
          if [ -d "evaluations" ]; then
            # 先清理旧的 public/evaluations（避免残留旧报告）
            rm -rf astro/public/evaluations
            cp -r evaluations astro/public/evaluations
            echo "✅ evaluations/ synced into astro/public/ ($(find evaluations -type f | wc -l) files)"
          else
            echo "⚠️ evaluations/ dir not found, creating empty placeholder"
            mkdir -p astro/public/evaluations
            echo '{"schema_version":"1.0","reports":[]}' > astro/public/evaluations/index.json
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Verify evaluations in dist
        run: |
          if [ -d "dist/evaluations" ]; then
            echo "✅ dist/evaluations exists: $(find dist/evaluations -type f | wc -l) files"
            ls dist/evaluations/
          else
            echo "❌ dist/evaluations MISSING"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: astro/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
