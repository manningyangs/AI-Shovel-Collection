name: Deploy Astro site to GitHub Pages

on:
  # Build on pushes to main that touch Astro project
  push:
    branches: [main]
    paths:
      - 'astro/**'
      - '.github/workflows/pages-astro.yml'
  # Build after live-data workflow completes (data updated → rebuild)
  workflow_run:
    workflows: ["Sync live multi-source catalog data"]
    types: ["completed"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent multiple concurrent deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      # 调试日志补丁：Astro 构建会 drop 所有 console.* 调用，
      # 用源文件覆盖 dist 中被处理过的 app.js（外部文件 + index.html 内联）
      - name: Patch debug logs (restore console.log in dist)
        run: |
          cp src/scripts/app.js dist/scripts/app.js
          SRC=$(cat src/scripts/app.js)
          # 替换 index.html 中内联的 app.js：找到 <script> 开头和 </script> 结尾
          # 保持 script 标签，中间插入源文件内容
          python3 -c "
          import re, sys
          html = open('dist/index.html', 'r', encoding='utf-8').read()
          src = open('src/scripts/app.js', 'r', encoding='utf-8').read()
          # 匹配 <script> 后跟 IIFE 开头直到 </script>
          pattern = r'<script>\uFEFF\(function \(\) \{.*?</script>'
          replacement = '<script>\uFEFF' + src.rstrip('\n') + '</script>'
          new_html = re.sub(pattern, replacement, html, flags=re.DOTALL)
          open('dist/index.html', 'w', encoding='utf-8').write(new_html)
          print('Patched inline script, [DEBUG] count:', new_html.count('[DEBUG]'))
          "

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: astro/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
