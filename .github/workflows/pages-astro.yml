name: Deploy Astro site to GitHub Pages

on:
  # Build on pushes to main that touch Astro project
  push:
    branches: [main]
    paths:
      - 'astro/**'
      - '.github/workflows/pages-astro.yml'
  # Build after live-data workflow completes (data updated → rebuild)
  workflow_run:
    workflows:
      - "Sync live multi-source catalog data"
      - "AI Shovel Evaluation"
    types: ["completed"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent multiple concurrent deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Copy evaluations/ into dist
        run: |
          cd ..
          if [ -d "evaluations" ]; then
            cp -r evaluations astro/dist/evaluations
            echo "✅ evaluations/ copied to dist ($(ls evaluations | wc -l) entries)"
          else
            echo "⚠️ evaluations/ dir not found, skipping"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: astro/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
