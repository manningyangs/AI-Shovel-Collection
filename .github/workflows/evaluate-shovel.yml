# AI Shovel Eval — Cloudflare Worker 驱动的无 Issue 评测工作流（V2）
#
# 触发方式：workflow_dispatch（由 Worker 通过 GitHub App Installation Token 调用）
#   repo_url   — 被测仓库地址
#   request_id — 评测任务 ID（EV-xxxxxxxx），进度回调与幂等主键
#
# 与旧版（Issue 触发）的差异：
#   - 移除 issues 触发、Issue 正文解析、评论/加标签/关闭 Issue 步骤
#   - 新增八阶段进度回调（HMAC 签名，经 scripts/eval/progress_client.py）
#   - 报告发布后显式 workflow_dispatch pages-astro.yml（GITHUB_TOKEN 的 push
#     不会触发 push 事件，workflow_dispatch 是官方允许的例外）
#
# 安全：analyze job 只读（persist-credentials: false），被测仓库代码不执行；
#       写权限（contents: write / actions: write）仅存在于 publish job。
name: AI Shovel Evaluation

run-name: "AI Shovel Eval · ${{ inputs.request_id || github.run_id }}"

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub 仓库地址"
        required: true
        type: string
      request_id:
        description: "评测任务 ID"
        required: true
        type: string

concurrency:
  group: ai-shovel-eval
  queue: max
  cancel-in-progress: false

jobs:
  # ========== Job A: Validate & Analyze（静态分析，只读权限） ==========
  analyze:
    name: 🧪 静态评测
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      report_id: ${{ steps.evaluate.outputs.report_id }}
    env:
      INPUT_REPO_URL: ${{ inputs.repo_url }}
      EVAL_REQUEST_ID: ${{ inputs.request_id }}
      EVAL_PROGRESS_URL: ${{ vars.EVAL_PROGRESS_URL || '' }}
      EVAL_PROGRESS_SECRET: ${{ secrets.EVAL_PROGRESS_SECRET }}
    steps:
      - name: Checkout (只读)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install requests

      # ---------- 运行 evaluator（安全：URL 从 env 读，Python 内部二次校验） ----------
      - name: Run evaluator
        id: evaluate
        env:
          REPO_URL: ${{ inputs.repo_url }}
          # GITHUB_TOKEN 只用于 GitHub API 读（提高限流额度），不暴露给被测仓库
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # URL 校验（Python 内部二次校验，双重保险）
          python3 -c "
          import sys; sys.path.insert(0, 'scripts')
          from eval.url_validator import validate_github_repo_url
          import os
          v = validate_github_repo_url(os.environ['REPO_URL'])
          print('✅ URL 校验通过:', v['owner'], v['repo'])
          "

          # 从 env 读 URL（安全，不拼 shell 命令行参数）
          python3 scripts/eval/evaluator.py \
            --repo-url "$REPO_URL" \
            --output /tmp/eval_report.json \
            --verbose

          REPORT_ID=$(python3 -c "import json; print(json.load(open('/tmp/eval_report.json'))['report_id'])")
          echo "report_id=$REPORT_ID" >> "$GITHUB_OUTPUT"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: /tmp/eval_report.json
          retention-days: 7

      # 失败回调：stage_index=0 表示保留当前阶段，仅置 failed 终态
      - name: Report failure to Worker
        if: failure()
        run: |
          python3 -m scripts.eval.progress_client fail --stage 0 \
            --message "静态评测失败，详见 Actions run ${{ github.run_id }}"

  # ========== Job B: Publish Report（报告发布，最低权限） ==========
  publish:
    name: 📝 发布报告
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      EVAL_REQUEST_ID: ${{ inputs.request_id }}
      EVAL_PROGRESS_URL: ${{ vars.EVAL_PROGRESS_URL || '' }}
      EVAL_PROGRESS_SECRET: ${{ secrets.EVAL_PROGRESS_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: eval-report
          path: /tmp

      - name: Validate + write report + update index
        id: write
        run: |
          python3 << 'PYEOF'
          import json, os, sys
          from pathlib import Path

          # 1. 读报告
          with open("/tmp/eval_report.json") as f:
              report = json.load(f)

          # 2. Schema 校验（publish 只处理经过校验的数据）
          sys.path.insert(0, "scripts")
          from eval.report_validator import validate_report
          valid, err = validate_report(report)
          if not valid:
              print(f"::error::报告校验失败: {err}")
              sys.exit(1)

          # 3. 写入 evaluations/reports/{report_id}.json
          report_id = report["report_id"]
          report_path = Path(f"evaluations/reports/{report_id}.json")
          report_path.parent.mkdir(parents=True, exist_ok=True)
          report_path.write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding="utf-8")
          print(f"📄 报告写入: {report_path}")

          # 4. 更新 evaluations/index.json
          index_path = Path("evaluations/index.json")
          if index_path.exists():
              idx = json.loads(index_path.read_text(encoding="utf-8"))
          else:
              idx = {"schema_version": "1.0", "reports": []}

          idx["reports"] = [r for r in idx["reports"] if r.get("report_id") != report_id]
          idx["reports"].insert(0, {
              "report_id": report_id,
              "owner": report["repository"]["owner"],
              "name": report["repository"]["name"],
              "url": report["repository"]["url"],
              "project_type": report["project_type"].get("type", "unknown") if isinstance(report["project_type"], dict) else None,
              "level": report["evaluation"]["level"],
              "score_status": report["evaluation"]["score_status"],
              "preliminary_score": report["evaluation"]["preliminary_score"],
              "grade": report["evaluation"].get("grade"),
              "coverage": report["evaluation"]["coverage"],
              "commit_sha": report["repository"]["commit_sha"][:12],
              "evaluated_at": report["evaluation"]["evaluated_at"],
          })
          idx["total_reports"] = len(idx["reports"])
          idx["updated_at"] = report["evaluation"]["evaluated_at"]
          index_path.write_text(json.dumps(idx, indent=2, ensure_ascii=False), encoding="utf-8")
          print(f"📊 index 更新: {len(idx['reports'])} 份报告")

          # 输出到 GITHUB_OUTPUT
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"report_id={report_id}\n")
              out.write(f"preliminary_score={report['evaluation']['preliminary_score']}\n")
              out.write(f"level={report['evaluation']['level']}\n")
              out.write(f"grade={report['evaluation'].get('grade', '')}\n")
          PYEOF

      # —— 阶段 7「报告生成与校验」完成 ——
      - name: Report stage 7 completed
        run: |
          python3 -m scripts.eval.progress_client progress \
            --stage 7 --status completed --message "报告结构校验通过，开始发布"

      # —— 阶段 8「报告发布」开始 ——
      - name: Report stage 8 started
        run: |
          python3 -m scripts.eval.progress_client progress \
            --stage 8 --status running --message "正在提交报告并触发站点部署"

      # ---------- Commit + Push ----------
      - name: Commit and push
        id: push
        run: |
          git config --local user.name "AI Shovel Eval Bot"
          git config --local user.email "ai-shovel-eval-bot@users.noreply.github.com"

          git add evaluations/
          if git diff --cached --quiet; then
              echo "No changes to commit"
          else
              git commit -m "🤖 AI Shovel Eval V1.0.1: publish ${{ steps.write.outputs.report_id }} (L1·静态 初评 ${{ steps.write.outputs.preliminary_score }}, 等级 ${{ steps.write.outputs.grade }})"
              git push origin main
              echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 显式触发 Pages 部署 ----------
      # pages-astro.yml 部署完成后回调 /internal/finalize 置 completed（需报告页真实 200）
      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_REPORT_ID: ${{ steps.write.outputs.report_id }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys, urllib.error, urllib.request

          payload = json.dumps({
              "ref": "main",
              "inputs": {
                  "request_id": os.environ["EVAL_REQUEST_ID"],
                  "report_id": os.environ["DISPATCH_REPORT_ID"],
              },
          }).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/manningyangs/AI-Shovel-Collection/"
              "actions/workflows/pages-astro.yml/dispatches",
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "ai-shovel-eval",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  print(f"Pages deploy dispatched: HTTP {resp.status}")
          except urllib.error.HTTPError as e:
              # 204 No Content 为历史正常响应
              if e.code == 204:
                  print("Pages deploy dispatched: HTTP 204")
              else:
                  body = e.read().decode(errors="replace")[:500]
                  print(f"::error::Pages dispatch failed: HTTP {e.code} {body}")
                  sys.exit(1)
          PYEOF

      # 发布链路任一步失败 → 回调 failed，避免任务卡死在 publishing
      - name: Report publish failure to Worker
        if: failure()
        run: |
          python3 -m scripts.eval.progress_client fail --stage 8 \
            --message "报告发布失败，详见 Actions run ${{ github.run_id }}"
