name: AI Shovel Evaluation

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      repo_url:
        description: GitHub repo URL (fallback when run manually)
        required: false
        default: ""
      issue_number:
        description: Issue number (optional, for posting result comment)
        required: false
        default: ""

# 只对带 evaluation-request label 的 opened issue 触发
# workflow_dispatch 始终可手动触发
# —— Issue Form 模板自动带 evaluation-request label，普通 issue 请手动添加
# —— 编辑 issue 不触发，避免重复评测
concurrency:
  group: ai-shovel-eval
  cancel-in-progress: false

jobs:
  # ========== Job A: Validate & Analyze（静态分析，只读权限） ==========
  analyze:
    name: 🧪 静态评测
    runs-on: ubuntu-latest
    # V1.0.1 fix: 去掉 label 硬过滤 — Issue Form 声明的 label 如果仓库不存在，GitHub 不会自动创建
    # 改成在 Parse step 里判断有没有 repo_url，没有就优雅 skip 后续 step
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'opened')
    outputs:
      skip_eval: ${{ steps.parse.outputs.skip_eval }}
      repo_url: ${{ steps.parse.outputs.repo_url }}
      issue_number: ${{ steps.parse.outputs.issue_number }}
      report_id: ${{ steps.evaluate.outputs.report_id }}
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout (只读)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install requests

      # ---------- 解析 repo_url（没有就 skip，不让整个 Job 被 if 跳过） ----------
      - name: Parse Issue body from event payload
        id: parse
        run: |
          REPO_URL=""
          ISSUE_NUMBER=""
          SKIP_EVAL="false"

          if [ -n "${{ github.event.issue.number }}" ]; then
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          fi

          if [ -n "${{ github.event.issue.body }}" ]; then
            export ISSUE_BODY="${{ github.event.issue.body }}"
          fi

          REPO_URL=$(python3 << 'PYEOF'
          import os, re
          body = os.environ.get("ISSUE_BODY", "") or ""
          inputs = os.environ.get("INPUT_REPO_URL", "")
          for line in body.split("\n"):
            line = line.strip()
            if not line or line.startswith("#") or line.startswith("_"):
              continue
            if "github.com/" in line or line.startswith("https://"):
              m = re.match(r"^https?://github\.com/[A-Za-z0-9_.\-]+/[A-Za-z0-9_.\-]+", line.rstrip("/.,;:!?"))
              if m:
                print(m.group(0).rstrip(".git"))
                raise SystemExit(0)
          if inputs:
            print(inputs.strip().rstrip(".,;:!?").rstrip("/").rstrip(".git"))
          PYEOF
          )

          if [ -z "$REPO_URL" ]; then
            echo "⚠️ 未从 Issue 正文或 workflow inputs 中找到 GitHub repo_url → 跳过评测"
            SKIP_EVAL="true"
          else
            echo "✅ 解析成功: repo_url=$REPO_URL"
          fi

          echo "repo_url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "skip_eval=$SKIP_EVAL" >> "$GITHUB_OUTPUT"
        env:
          INPUT_REPO_URL: ${{ github.event.inputs.repo_url }}
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}

      # ---------- 运行 evaluator（安全：URL 从 env 读，Python 内部二次校验） ----------
      - name: Run evaluator
        id: evaluate
        if: steps.parse.outputs.skip_eval != 'true'
        env:
          REPO_URL: ${{ steps.parse.outputs.repo_url }}
          # GITHUB_TOKEN 只用于 GitHub API 读（提高限流额度），不暴露给被测仓库
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # URL 校验（Python 内部二次校验，双重保险）
          python3 -c "
          import sys; sys.path.insert(0, 'scripts')
          from eval.url_validator import validate_github_repo_url
          import os
          v = validate_github_repo_url(os.environ['REPO_URL'])
          print('✅ URL 校验通过:', v['owner'], v['repo'])
          "

          # 从 env 读 URL（安全，不拼 shell 命令行参数）
          python3 scripts/eval/evaluator.py \
            --repo-url "$REPO_URL" \
            --output /tmp/eval_report.json \
            --verbose

          REPORT_ID=$(python3 -c "import json; print(json.load(open('/tmp/eval_report.json'))['report_id'])")
          echo "report_id=$REPORT_ID" >> "$GITHUB_OUTPUT"

      - name: Upload report artifact
        if: steps.parse.outputs.skip_eval != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: /tmp/eval_report.json
          retention-days: 7

  # ========== Job B: Publish Report（报告发布，最低权限） ==========
  publish:
    name: 📝 发布报告
    needs: analyze
    runs-on: ubuntu-latest
    # V1.0.1 fix: 只有真正跑了评测才发布（skip_eval=true → analyze 里 evaluator 没跑 → 不该 publish）
    if: always() && needs.analyze.result == 'success' && needs.analyze.outputs.skip_eval != 'true'
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: eval-report
          path: /tmp

      - name: Validate + write report + update index
        id: write
        run: |
          python3 << 'PYEOF'
          import json, os, sys
          from pathlib import Path

          # 1. 读报告
          with open("/tmp/eval_report.json") as f:
              report = json.load(f)

          # 2. Schema 校验（publish 只处理经过校验的数据）
          sys.path.insert(0, "scripts")
          from eval.report_validator import validate_report
          valid, err = validate_report(report)
          if not valid:
              print(f"::error::报告校验失败: {err}")
              sys.exit(1)

          # 3. 写入 evaluations/reports/{report_id}.json
          report_id = report["report_id"]
          report_path = Path(f"evaluations/reports/{report_id}.json")
          report_path.parent.mkdir(parents=True, exist_ok=True)
          report_path.write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding="utf-8")
          print(f"📄 报告写入: {report_path}")

          # 4. 更新 evaluations/index.json
          index_path = Path("evaluations/index.json")
          if index_path.exists():
              idx = json.loads(index_path.read_text(encoding="utf-8"))
          else:
              idx = {"schema_version": "1.0", "reports": []}

          idx["reports"] = [r for r in idx["reports"] if r.get("report_id") != report_id]
          idx["reports"].insert(0, {
              "report_id": report_id,
              "owner": report["repository"]["owner"],
              "name": report["repository"]["name"],
              "url": report["repository"]["url"],
              "project_type": report["project_type"].get("type", "unknown") if isinstance(report["project_type"], dict) else None,
              "level": report["evaluation"]["level"],
              "score_status": report["evaluation"]["score_status"],
              "preliminary_score": report["evaluation"]["preliminary_score"],
              "grade": report["evaluation"].get("grade"),
              "coverage": report["evaluation"]["coverage"],
              "commit_sha": report["repository"]["commit_sha"][:12],
              "evaluated_at": report["evaluation"]["evaluated_at"],
          })
          idx["total_reports"] = len(idx["reports"])
          idx["updated_at"] = report["evaluation"]["evaluated_at"]
          index_path.write_text(json.dumps(idx, indent=2, ensure_ascii=False), encoding="utf-8")
          print(f"📊 index 更新: {len(idx['reports'])} 份报告")

          # 5. 评论摘要（V1.0.1 修正 —— 明确标注 L1 静态分析）
          ps = report["evaluation"]["preliminary_score"]
          level = report["evaluation"]["level"]
          coverage = report["evaluation"]["coverage"]
          grade = report["evaluation"].get("grade", "?")
          owner = report["repository"]["owner"]
          name = report["repository"]["name"]
          prtype = report["project_type"].get("type", "unknown") if isinstance(report["project_type"], dict) else "unknown"

          summary = (
              f"## 🧪 AI Shovel Eval — 评测完成\n\n"
              f"| 项目 | 值 |\n"
              f"|---|---|\n"
              f"| **仓库** | [{owner}/{name}](https://github.com/{owner}/{name}) |\n"
              f"| **评测模式** | {level} · 静态分析 |\n"
              f"| **项目类型** | {prtype} |\n"
              f"| **综合初评** | **{ps}/100** · 评级 **{grade}** |\n"
              f"| **覆盖率** | {coverage}% |\n"
              f"| **评测 Commit** | `{report['repository']['commit_sha'][:12]}` |\n\n"
              f"> ⚠️ 本报告为 **L1 静态分析**，未执行被测仓库中的任何代码。\n"
              f"> 评分仅为自动化分析结果，不等于真实运行表现或人工认证。\n\n"
              f"📄 **完整报告**：将在 GitHub Pages 部署后可访问 `/AI-Shovel-Collection/evaluations/{report_id}/`"
          )
          Path("/tmp/eval_comment.md").write_text(summary, encoding="utf-8")

          # 输出到 GITHUB_OUTPUT
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"report_id={report_id}\n")
              out.write(f"preliminary_score={ps}\n")
              out.write(f"level={level}\n")
              out.write(f"grade={grade}\n")
          PYEOF

      # ---------- Commit + Push ----------
      # 只处理经过 schema 校验的 JSON（publish job 做了二次校验）
      - name: Commit and push
        id: push
        run: |
          git config --local user.name "AI Shovel Eval Bot"
          git config --local user.email "ai-shovel-eval-bot@users.noreply.github.com"

          git add evaluations/
          if git diff --cached --quiet; then
              echo "No changes to commit"
          else
              git commit -m "🤖 AI Shovel Eval V1.0.1: publish ${{ steps.write.outputs.report_id }} (L1·静态 初评 ${{ steps.write.outputs.preliminary_score }}, 等级 ${{ steps.write.outputs.grade }})"
              git push origin main
              echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------- Issue 评论 ----------
      - name: Comment on Issue
        if: steps.push.outputs.pushed == 'true' && needs.analyze.outputs.issue_number != ''
        run: |
          ISSUE_NUMBER="${{ needs.analyze.outputs.issue_number }}"
          BODY=$(cat /tmp/eval_comment.md)

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$(python3 -c 'import sys,json; print(json.dumps({"body": open("/tmp/eval_comment.md").read()}))')" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments"
          echo "✅ 已评论 Issue #${ISSUE_NUMBER}"

      # ---------- 给 Issue 加标签 ----------
      - name: Add label to Issue
        if: needs.analyze.outputs.issue_number != ''
        run: |
          ISSUE_NUMBER="${{ needs.analyze.outputs.issue_number }}"
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/labels" \
            -d '["eval-completed", "L1-static-analysis"]' \
            || echo "Label add failed (label may not exist)"
