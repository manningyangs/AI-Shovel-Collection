name: Sync live multi-source catalog data

on:
  schedule:
    - cron: "23 */6 * * *"   # 每 6 小时（UTC）同步一次
  workflow_dispatch:          # 支持手动触发
  push:
    paths:
      - catalog.csv           # 目录数据变更时立即同步
      - scripts/update_live_data.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12   # Phase 3: +端点实测（142 端点并发 10，最坏 ~2min）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run multi-source Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_live_data.py

      - name: Commit live_multi.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_multi.json
          git diff --cached --quiet || git commit -m "chore: 同步多源实时数据"
          # fetch 再 push，避开本地过期快照导致的 rejected
          git fetch origin main
          git pull --rebase origin main --autostash || true
          git push origin main --force-with-lease
